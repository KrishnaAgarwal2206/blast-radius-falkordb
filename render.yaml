# Render.com blueprint (free web service). FalkorDB Cloud free tier provides the database.
services:
  - type: web
    name: blast-radius
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FALKORDB_HOST        # from the FalkorDB Cloud instance page
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY    # optional: only for the LLM-agent toggle
        sync: false
      - key: SPEND_LIMIT_USD
        value: "3"
