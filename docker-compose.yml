services:
  falkordb:
    image: falkordb/falkordb:latest
    ports: ["6379:6379", "3000:3000"]   # 3000 = FalkorDB Browser
    volumes: ["falkordb-data:/var/lib/falkordb/data"]
    environment:
      - FALKORDB_ARGS=TIMEOUT_MAX 30000 TIMEOUT_DEFAULT 8000
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - FALKORDB_HOST=falkordb
    volumes: ["./data:/app/data"]
    depends_on: [falkordb]
  ingest:           # one-shot: docker compose run --rm ingest
    build: .
    profiles: ["tools"]
    command: ["python", "-m", "blast.ingest.cli", "https://github.com/open-telemetry/opentelemetry-python", "--graph", "otel", "--ref", "2fa016b27d9b817aee88ea58be1bd0bc10fd2a40"]
    environment: [FALKORDB_HOST=falkordb]
    volumes: ["./data:/app/data"]
    depends_on: [falkordb]
volumes:
  falkordb-data:
