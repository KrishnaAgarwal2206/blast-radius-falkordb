services:
  falkordb:
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a   # pinned (module 42201)
    ports: ["6379:6379", "3000:3000"]   # 3000 = FalkorDB Browser
    volumes: ["falkordb-data:/var/lib/falkordb/data"]
    environment:
      - FALKORDB_ARGS=TIMEOUT_MAX 30000 TIMEOUT_DEFAULT 8000
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - FALKORDB_HOST=falkordb
    volumes: ["./data:/app/data"]
    depends_on: [falkordb]
  ingest:           # one-shot: docker compose run --rm ingest   (needs network: PyPI wheels, OSV, GitHub fix diffs)
    build: .
    profiles: ["tools"]
    command: ["sh", "-c", "for a in yamlfull precommit cookiecutter httpie; do python -m blast.supply.pipeline $$a --no-checks; done"]
    environment: [FALKORDB_HOST=falkordb]
    volumes: ["./data:/app/data"]
    depends_on: [falkordb]
volumes:
  falkordb-data:
